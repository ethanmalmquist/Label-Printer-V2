<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FleeetX Chat Bubble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1F22; --steel:#4B555F; --paper:#F2F0EA; --border:#DCD8CC;
    --amber:#F2B705; --amber-dark:#C98F02;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; background:transparent;
    font-family:'Inter',system-ui,sans-serif; color:var(--ink);
  }

  /* ---- launcher bubble ---- */
  .launcher{
    position:fixed; right:24px; bottom:24px; width:58px; height:58px; border-radius:50%;
    background:var(--ink); border:none; cursor:pointer; display:flex; align-items:center;
    justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:1001;
    transition:transform .12s ease;
  }
  .launcher:hover{ transform:scale(1.05); }
  .launcher svg{ width:26px; height:26px; }
  .launcher-badge{
    position:absolute; top:-2px; right:-2px; width:14px; height:14px; border-radius:50%;
    background:var(--amber); border:2px solid var(--paper);
  }

  /* ---- expandable panel ---- */
  .panel{
    position:fixed; right:24px; bottom:96px; width:420px; max-width:calc(100vw - 32px);
    height:680px; max-height:calc(100vh - 120px); background:var(--paper); border-radius:16px;
    border:1px solid var(--border); box-shadow:0 20px 60px rgba(0,0,0,.25); overflow:hidden;
    display:flex; flex-direction:column; z-index:1000;
    opacity:0; transform:translateY(16px) scale(.98); pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .panel.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }

  .panel-header{
    background:var(--ink); color:#fff; padding:12px 14px; display:flex; align-items:center;
    justify-content:space-between; flex-shrink:0;
  }
  .panel-title{font-family:'Oswald',sans-serif; font-size:14px; font-weight:600;}
  .back-btn{background:none; border:none; color:#fff; cursor:pointer; font-size:12px;
    display:flex; align-items:center; gap:4px; opacity:.85;}
  .back-btn:hover{opacity:1;}
  .close-btn{background:none; border:none; color:#fff; cursor:pointer; font-size:18px; line-height:1; opacity:.85;}
  .close-btn:hover{opacity:1;}

  /* ---- picker (shown before a demo is chosen) ---- */
  .picker{flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:10px;}
  .picker-intro{font-size:12.5px; color:var(--steel); line-height:1.5; margin-bottom:4px;}
  .option{
    background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:13px 14px;
    cursor:pointer; text-align:left; transition:border-color .12s;
  }
  .option:hover{border-color:var(--ink);}
  .option-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; margin-bottom:2px;}
  .option-desc{font-size:11.5px; color:var(--steel); line-height:1.4;}
  .option.warn .option-title{color:#A8432F;}

  .panel iframe{flex:1; border:none; width:100%;}
</style>
</head>
<body>

<div class="panel" id="panel">
  <div class="panel-header">
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="back-btn" id="backBtn" onclick="showPicker()" style="display:none;">&larr; Back</button>
      <span class="panel-title" id="panelTitle">FleeetX Rental Desk</span>
    </div>
    <button class="close-btn" onclick="closePanel()">&times;</button>
  </div>
  <div class="picker" id="picker">
    <div class="picker-intro">Pick a version to try:</div>
    <div class="option" onclick="loadDemo('scripted-demo.html', 'Scripted Demo')">
      <div class="option-title">Scripted Demo</div>
      <div class="option-desc">No API calls, instant, works offline.</div>
    </div>
    <div class="option" onclick="loadDemo('xai-agent.html', 'Grok Agent')">
      <div class="option-title">Grok (xAI) Agent</div>
      <div class="option-desc">Real model, real tool calls — paste in your own xAI key.</div>
    </div>
    <div class="option warn" onclick="loadDemo('claude-agent.html', 'Claude Agent')">
      <div class="option-title">Claude Agent (reference only)</div>
      <div class="option-desc">Won't function outside a Claude.ai artifact — loads with its own warning.</div>
    </div>
  </div>
</div>

<button class="launcher" id="launcherBtn" onclick="togglePanel()" aria-label="Open chat">
  <span class="launcher-badge" id="launcherBadge"></span>
  <svg id="launcherIcon" viewBox="0 0 24 24" fill="none">
    <path d="M4 4h16v12H8l-4 4V4z" stroke="#F2B705" stroke-width="2" stroke-linejoin="round"/>
  </svg>
</button>

<script>
  // Pure presentation/lazy-loading wrapper. Does not modify, inline, or alter
  // scripted-demo.html / xai-agent.html / claude-agent.html in any way — each
  // loads unmodified inside an iframe, and only once explicitly picked, so
  // nothing (including any API-backed agent) starts running before the
  // visitor actually opens the bubble and picks one.
  let panelOpen = false;

  function togglePanel(){
    panelOpen = !panelOpen;
    document.getElementById('panel').classList.toggle('open', panelOpen);
    document.getElementById('launcherBadge').style.display = panelOpen ? 'none' : 'block';
    document.getElementById('launcherIcon').innerHTML = panelOpen
      ? '<path d="M6 6L18 18M18 6L6 18" stroke="#F2B705" stroke-width="2.4" stroke-linecap="round"/>'
      : '<path d="M4 4h16v12H8l-4 4V4z" stroke="#F2B705" stroke-width="2" stroke-linejoin="round"/>';
    if(!panelOpen) showPicker(); // reset to picker next time it's reopened
  }
  function closePanel(){
    panelOpen = false;
    document.getElementById('panel').classList.remove('open');
    document.getElementById('launcherBadge').style.display = 'block';
    document.getElementById('launcherIcon').innerHTML = '<path d="M4 4h16v12H8l-4 4V4z" stroke="#F2B705" stroke-width="2" stroke-linejoin="round"/>';
  }
  function loadDemo(file, title){
    document.getElementById('picker').style.display = 'none';
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('panelTitle').textContent = title;
    let existing = document.getElementById('demoFrame');
    if(existing) existing.remove();
    const iframe = document.createElement('iframe');
    iframe.id = 'demoFrame';
    iframe.src = file;
    document.getElementById('panel').appendChild(iframe);
  }
  function showPicker(){
    const frame = document.getElementById('demoFrame');
    if(frame) frame.remove();
    document.getElementById('picker').style.display = 'flex';
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('panelTitle').textContent = 'FleeetX Rental Desk';
  }
</script>
</body>
</html>
