<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FleeetX Rental Desk Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1F22;
    --ink-soft:#33383D;
    --steel:#4B555F;
    --steel-dark:#363E46;
    --paper:#F2F0EA;
    --paper-deep:#E8E4DA;
    --amber:#F2B705;
    --amber-dark:#C98F02;
    --green:#2E7D5B;
    --green-bg:#E4F0EA;
    --red:#A8432F;
    --red-bg:#F3E4E0;
    --border:#DCD8CC;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:transparent;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  .widget{
    width:100%;
    max-width:420px;
    height:100%;
    margin:0 auto;
    background:var(--paper);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    border:1px solid var(--border);
  }

  /* ---------- Header ---------- */
  .header{
    background:var(--ink);
    color:#fff;
    padding:16px 18px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .header-left{display:flex; align-items:center; gap:12px;}
  .fork-mark{width:30px; height:30px; flex-shrink:0;}
  .eyebrow{
    font-family:'Oswald',sans-serif;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{width:6px; height:6px; border-radius:50%; background:var(--amber); display:inline-block; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .agent-name{
    font-family:'Oswald',sans-serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.01em;
    margin-top:2px;
  }
  .reset-btn{
    background:none;border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.75);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.04em;
    padding:6px 10px; border-radius:20px; cursor:pointer; text-transform:uppercase;
    transition:all .15s;
  }
  .reset-btn:hover{background:rgba(255,255,255,0.1); color:#fff;}

  /* mast gauge */
  .gauge{width:16px; height:40px; position:relative; flex-shrink:0;}
  .gauge-track{
    width:6px; height:100%; margin:0 auto; background:rgba(255,255,255,0.15);
    border-radius:3px; position:relative; overflow:hidden;
  }
  .gauge-fill{
    position:absolute; bottom:0; left:0; width:100%; background:var(--amber);
    border-radius:3px; transition:height .4s ease;
  }
  .gauge-split{
    position:absolute; left:-3px; width:12px; height:1px; background:rgba(255,255,255,0.4);
  }
  .gauge-labels{
    position:absolute; right:-14px; top:0; height:100%; display:flex; flex-direction:column;
    justify-content:space-between; font-family:'Oswald',sans-serif; font-size:8px; color:rgba(255,255,255,0.45);
  }

  /* hazard stripe divider */
  .stripe{
    height:5px; flex-shrink:0;
    background:repeating-linear-gradient(-45deg, var(--amber) 0 8px, var(--ink) 8px 16px);
  }

  /* ---------- Message area ---------- */
  .messages{
    flex:1; overflow-y:auto; padding:16px 14px 8px;
    display:flex; flex-direction:column; gap:10px;
  }
  .msg{max-width:82%; font-size:13.5px; line-height:1.45; padding:9px 12px; border-radius:var(--radius); white-space:pre-wrap;}
  .msg.bot{
    align-self:flex-start; background:#fff; border:1px solid var(--border);
    border-bottom-left-radius:3px;
  }
  .msg.user{
    align-self:flex-end; background:var(--steel-dark); color:#fff;
    border-bottom-right-radius:3px;
  }
  .msg-label{
    font-family:'Oswald',sans-serif; font-size:9.5px; letter-spacing:0.09em; text-transform:uppercase;
    opacity:0.5; margin-bottom:3px; display:block;
  }

  /* equipment card */
  .card{
    align-self:flex-start; max-width:92%; background:#fff; border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 12px; font-size:12.5px;
  }
  .card-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .card-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px;}
  .tag{
    font-family:'Oswald',sans-serif; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:2px 7px; border-radius:20px; font-weight:600;
  }
  .tag.avail{background:var(--green-bg); color:var(--green);}
  .tag.out{background:var(--red-bg); color:var(--red);}
  .spec-grid{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
    display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; margin-bottom:7px;
  }
  .card-rate{
    font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:13px;
    border-top:1px dashed var(--border); padding-top:6px; display:flex; justify-content:space-between;
  }
  .card-rate b{font-size:14.5px;}

  /* quick replies */
  .replies{display:flex; flex-wrap:wrap; gap:6px; padding:2px 14px 10px;}
  .chip{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500;
    background:#fff; border:1.5px solid var(--steel); color:var(--ink);
    padding:7px 13px; border-radius:20px; cursor:pointer; transition:all .12s;
  }
  .chip:hover{background:var(--amber); border-color:var(--amber-dark); color:var(--ink);}
  .chip.selected{background:var(--ink); border-color:var(--ink); color:#fff;}
  .chip.confirm{background:var(--amber); border-color:var(--amber-dark); font-weight:600;}
  .chip.confirm:hover{background:var(--amber-dark);}

  /* input row */
  .input-row{
    display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border); background:#fff;
  }
  .input-row input{
    flex:1; border:1.5px solid var(--border); border-radius:20px; padding:9px 14px;
    font-family:'Inter',sans-serif; font-size:13px; outline:none;
  }
  .input-row input:focus{border-color:var(--steel);}
  .send-btn{
    background:var(--amber); border:none; border-radius:50%; width:38px; height:38px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:background .12s;
  }
  .send-btn:hover{background:var(--amber-dark);}
  .send-btn svg{width:16px; height:16px;}

  .messages::-webkit-scrollbar{width:6px;}
  .messages::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
</style>
</head>
<body>

<div class="widget">
  <div class="header">
    <div class="header-left">
      <svg class="fork-mark" viewBox="0 0 30 30" fill="none">
        <rect x="4" y="3" width="3" height="24" fill="var(--amber)"/>
        <rect x="10" y="3" width="3" height="24" fill="var(--amber)"/>
        <rect x="4" y="24" width="20" height="3" fill="#fff" opacity="0.85"/>
        <rect x="20" y="10" width="4" height="17" fill="#fff" opacity="0.85"/>
      </svg>
      <div>
        <div class="eyebrow"><span class="dot"></span>FleeetX Rental Desk &middot; Live</div>
        <div class="agent-name">Casey</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="gauge">
        <div class="gauge-track">
          <div class="gauge-fill" id="gaugeFill" style="height:0%"></div>
          <div class="gauge-split" style="bottom:42%"></div>
        </div>
        <div class="gauge-labels"><span>B</span><span>A</span></div>
      </div>
      <button class="reset-btn" onclick="resetChat()">Reset</button>
    </div>
  </div>
  <div class="stripe"></div>
  <div class="messages" id="messages"></div>
  <div class="replies" id="replies"></div>
  <div class="input-row">
    <input type="text" id="textInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')submitText()">
    <button class="send-btn" onclick="submitText()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11L21 3L13 21L11 13L3 11Z" fill="#1C1F22"/></svg>
    </button>
  </div>
</div>

odel": "8FGC70U", "category": "Forklift", "item_type_code": "FL", "capacity_lbs": 15000, "tire_type": "Cushion", "fuel_type": "LPG", "extended_height_in": 175, "attachments": "Side Shift", "status": "Available", "daily_rate_usd": 589, "weekly_rate_usd": 1000, "monthly_rate_usd": 2900, "start_date": null, "return_date": null}];

<script>
// ============ Conversation state ============
let ctx = {
  intent:null, name:null, company:null, phone:null, email:null, timeline:null,
  category:null, capacityMin:null, tireType:null, fuelType:null, heightPref:null,
  attachments:[], duration:null
};
let step = 'GREETING';
let pendingMultiSelect = [];

const TOTAL_A = 5;   // name, company, phone, email, timeline
const TOTAL_B = 7;   // category, capacity, environment, fuel, height, attachments, duration
let progress = 0;

function setGauge(){
  const frac = Math.min(progress / (TOTAL_A + TOTAL_B), 1);
  document.getElementById('gaugeFill').style.height = (frac*100).toFixed(0) + '%';
}

// ============ Rendering ============
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }

function addMsg(who, text){
  const wrap = el('div', 'msg ' + who, text.replace(/\n/g,'<br>'));
  document.getElementById('messages').appendChild(wrap);
  scrollDown();
}

function addCard(unit, rateLabel, rateValue){
  const c = el('div','card');
  const avail = unit.status === 'Available';
  c.innerHTML = `
    <div class="card-top">
      <span class="card-title">${unit.make} ${unit.model}</span>
      <span class="tag ${avail?'avail':'out'}">${avail?'Available':'Rented — back ' + (unit.return_date||'soon')}</span>
    </div>
    <div class="spec-grid">
      <span>CAP &nbsp;${unit.capacity_lbs.toLocaleString()} lb</span>
      <span>TIRE &nbsp;${unit.tire_type}</span>
      <span>FUEL &nbsp;${unit.fuel_type}</span>
      <span>HGT &nbsp;${unit.extended_height_in}"</span>
    </div>
    ${unit.attachments ? `<div style="font-size:11px; color:var(--steel); margin-bottom:6px;">+ ${unit.attachments}</div>` : ''}
    <div class="card-rate"><span>${rateLabel}</span><b>$${rateValue.toLocaleString()}</b></div>
  `;
  document.getElementById('messages').appendChild(c);
  scrollDown();
}

function scrollDown(){
  const m = document.getElementById('messages');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ m.scrollTop = m.scrollHeight; }));
}
// Safety net: pin to bottom on any change to the message list (card renders, font-swap
// reflow, etc.), not just the call sites that already invoke scrollDown() directly.
new MutationObserver(scrollDown).observe(document.getElementById('messages'), {childList:true, subtree:true, characterData:true});

function clearReplies(){ document.getElementById('replies').innerHTML=''; }

function showChips(options, opts={}){
  clearReplies();
  const box = document.getElementById('replies');
  options.forEach(o=>{
    const chip = el('div','chip'+(opts.confirm && o.confirm ? ' confirm':''), o.label);
    chip.onclick = ()=>{
      if(opts.multi){
        toggleMulti(o, chip);
      } else {
        addMsg('user', o.label);
        clearReplies();
        opts.onPick(o);
      }
    };
    box.appendChild(chip);
  });
}

function toggleMulti(o, chipEl){
  if(o.confirm){
    addMsg('user', pendingMultiSelect.length ? pendingMultiSelect.map(x=>x.label).join(', ') : 'None needed');
    const picked = pendingMultiSelect.slice();
    pendingMultiSelect = [];
    clearReplies();
    o.onConfirm(picked);
    return;
  }
  const idx = pendingMultiSelect.indexOf(o);
  if(idx>-1){ pendingMultiSelect.splice(idx,1); chipEl.classList.remove('selected'); }
  else { pendingMultiSelect.push(o); chipEl.classList.add('selected'); }
}

// ============ Input handling ============
function submitText(){
  const input = document.getElementById('textInput');
  const val = input.value.trim();
  if(!val) return;
  input.value='';
  addMsg('user', val);
  clearReplies();
  handleFreeText(val);
}

function handleFreeText(text){
  const lower = text.toLowerCase();
  switch(step){
    case 'GREETING':
      // loose keyword routing if they type instead of clicking
      if(/part|service|repair|warranty|bill|invoice|existing|status/.test(lower)) routeAway();
      else startIntake();
      break;
    case 'NAME': ctx.name=text; progress++; setGauge(); askCompany(); break;
    case 'COMPANY': ctx.company=text; progress++; setGauge(); askPhone(); break;
    case 'PHONE': ctx.phone=text; progress++; setGauge(); askEmail(); break;
    case 'EMAIL': ctx.email=text; progress++; setGauge(); askTimeline(); break;
    case 'TIMELINE': ctx.timeline=text; progress++; setGauge(); askCategory(); break;
    case 'CAPACITY': {
      const n = parseInt(lower.replace(/[^0-9]/g,''),10);
      ctx.capacityMin = isNaN(n) ? 0 : n;
      progress++; setGauge(); askEnvironment();
      break;
    }
    case 'HEIGHT_FREE': ctx.heightPref=text; progress++; setGauge(); askAttachments(); break;
    case 'ROUTE_ISSUE': finishRouting(text); break;
    case 'ORDER_LOOKUP': lookupOrder(text); break;
    case 'CALLBACK_TIME': confirmCallback(text); break;
    default:
      addMsg('bot', "Got it — one sec while I catch up on the flow above.");
  }
}

// ============ Phase A: intake ============
function startChat(){
  addMsg('bot', "Thanks for stopping by FleeetX — I'm Casey. What can I help you with today?");
  showChips([
    {label:'Rent equipment'},
    {label:'Parts or service'},
    {label:'Check an existing order'},
    {label:'Something else'}
  ], { onPick(o){
      if(o.label==='Rent equipment') startIntake();
      else if(o.label==='Check an existing order') startOrderLookup();
      else routeAway();
    }});
  step='GREETING';
}

function startOrderLookup(){
  addMsg('bot', "Sure — what's the unit number or serial number on the equipment? (Unit numbers look like \"AR 1102\".)");
  step='ORDER_LOOKUP';
}

function lookupOrder(raw){
  const norm = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
  const q = norm(raw);
  if(!q){ addMsg('bot',"I didn't catch a number there — what's the unit or serial number?"); return; }
  const matches = FLEET.filter(u => norm(u.unit_number).includes(q) || norm(u.serial_number).includes(q));
  if(matches.length === 0){
    addMsg('bot', "I'm not finding that one — mind double-checking the number? I can also flag this for the rental team to look up by hand.");
    showChips([{label:'Flag for rental team'},{label:'Try another number'}], { onPick(o){
      if(o.label==='Try another number'){ step='ORDER_LOOKUP'; }
      else { addMsg('bot', "Got it — I've flagged it for the team to track down. Anything else?"); clearReplies(); }
    }});
    return;
  }
  if(matches.length > 1){
    addMsg('bot', "That matches more than one unit — got the other number (unit or serial) to narrow it down?");
    step='ORDER_LOOKUP';
    return;
  }
  const u = matches[0];
  if(u.status === 'Rented Out'){
    addMsg('bot', `${u.unit_number} (${u.make} ${u.model}) is out since ${u.start_date||'—'}, due back ${u.return_date||'soon'}. That's the current expected return date.`);
  } else {
    addMsg('bot', `${u.unit_number} (${u.make} ${u.model}) isn't showing as currently checked out — it may have already been returned. Want me to route this to the rental team to confirm the full order history?`);
    showChips([{label:'Yes, please'},{label:'No, that\'s all'}], { onPick(o){
      addMsg('bot', o.label==='Yes, please' ? "Done — they'll follow up shortly." : "No problem.");
      clearReplies();
    }});
    return;
  }
  addMsg('bot', "Anything else I can help with?");
  showChips([{label:'That\'s all, thanks'}], { onPick(){ closeChat(); } });
}

function routeAway(){
  addMsg('bot', "Got it — that's handled by a different team, but I can get you routed. What's your name, and briefly, what's going on?");
  step='ROUTE_ISSUE';
}
function finishRouting(text){
  addMsg('bot', `Thanks — I've logged that and someone from the right team will follow up shortly. Anything else?`);
  clearReplies();
}

function startIntake(){
  addMsg('bot', "Happy to help you get something rented. Can I get your name first?");
  step='NAME';
}
function askCompany(){ addMsg('bot', `Thanks, ${ctx.name}. What company are you with?`); step='COMPANY'; }
function askPhone(){ addMsg('bot', "Best phone number to reach you at?"); step='PHONE'; }
function askEmail(){ addMsg('bot', "And an email address to send details to?"); step='EMAIL'; }
function askTimeline(){
  addMsg('bot', "When do you need this rented?");
  showChips([{label:'This week'},{label:'Next 2 weeks'},{label:'Just researching'}], {
    onPick(o){ ctx.timeline=o.label; progress++; setGauge(); askCategory(); }
  });
  step='TIMELINE';
}

// ============ Phase B: equipment matching ============
function askCategory(){
  addMsg('bot', "Now let's find the right equipment. What type are you looking for?");
  showChips([
    {label:'Forklift', value:'Forklift'},
    {label:'Scissor Lift', value:'Scissor Lift'},
    {label:'Piggyback Forklift (Truck-Mounted)', value:'Piggyback Forklift (Truck-Mounted)'},
    {label:"Not sure", value:null}
  ], { onPick(o){ ctx.category=o.value; progress++; setGauge(); askCapacity(); } });
  step='CATEGORY';
}
function askCapacity(){
  addMsg('bot', "About how much weight will it need to lift? Tap a range or type an exact number.");
  showChips([
    {label:'Up to 5,000 lb', value:5000},
    {label:'5,000–8,000 lb', value:8000},
    {label:'8,000+ lb', value:8000},
    {label:'Not sure', value:0}
  ], { onPick(o){ ctx.capacityMin=o.value; progress++; setGauge(); askEnvironment(); } });
  step='CAPACITY';
}
function askEnvironment(){
  addMsg('bot', "Will it mainly work indoors on a smooth floor, or outside on gravel/uneven ground?");
  showChips([
    {label:'Indoor — smooth floor', value:'Cushion'},
    {label:'Outdoor — rough ground', value:'Pneumatic'},
    {label:'Both / either', value:null}
  ], { onPick(o){ ctx.tireType=o.value; progress++; setGauge(); askFuel(); } });
  step='ENVIRONMENT';
}
function askFuel(){
  addMsg('bot', "Any preference on power — electric, propane, or diesel?");
  showChips([
    {label:'Electric', value:'Electric'},
    {label:'Propane', value:'LPG'},
    {label:'Diesel', value:'Diesel'},
    {label:'No preference', value:null}
  ], { onPick(o){ ctx.fuelType=o.value; progress++; setGauge(); askHeight(); } });
  step='FUEL';
}
function askHeight(){
  addMsg('bot', 'How high do you need to reach?');
  showChips([
    {label:'Standard racking (~189")', value:0},
    {label:'Taller than that', value:220},
    {label:'Not sure', value:0}
  ], { onPick(o){ ctx.heightPref=o.value; progress++; setGauge(); askAttachments(); } });
  step='HEIGHT';
}
function askAttachments(){
  addMsg('bot', "Any must-have attachments? Tap any that apply, then Done.");
  pendingMultiSelect=[];
  const opts = ['Side Shift','Fork Positioner','Clamp','A/C Cab','Rotator'].map(l=>({label:l}));
  opts.push({label:'Done', confirm:true, onConfirm(picked){
    ctx.attachments = picked.map(p=>p.label);
    progress++; setGauge(); askDuration();
  }});
  showChips(opts, { multi:true });
  step='ATTACHMENTS';
}
function askDuration(){
  addMsg('bot', "Last one — how long do you need it for?");
  showChips([
    {label:'A day', value:'daily_rate_usd'},
    {label:'A week', value:'weekly_rate_usd'},
    {label:'A month', value:'monthly_rate_usd'},
    {label:'Ongoing', value:'monthly_rate_usd'}
  ], { onPick(o){ ctx.duration=o.value; progress++; setGauge(); runSearch(); } });
  step='DURATION';
}

// ============ Search ============
function searchFleet(){
  let relaxed = [];
  function run(f){
    return FLEET.filter(u=>{
      if(u.status!=='Available') return false;
      if(f.category && u.category!==f.category) return false;
      if(f.capacityMin && u.capacity_lbs < f.capacityMin) return false;
      if(f.tireType && u.tire_type!==f.tireType) return false;
      if(f.fuelType && u.fuel_type!==f.fuelType) return false;
      if(f.attachments && f.attachments.length){
        const has = (u.attachments||'').split(',').map(s=>s.trim());
        if(!f.attachments.every(a=>has.includes(a))) return false;
      }
      return true;
    }).sort((a,b)=>a.capacity_lbs-b.capacity_lbs);
  }
  let filters = {category:ctx.category, capacityMin:ctx.capacityMin, tireType:ctx.tireType,
                 fuelType:ctx.fuelType, attachments:ctx.attachments};
  let results = run(filters);
  if(results.length===0 && filters.attachments && filters.attachments.length){ relaxed.push('attachment preference'); filters={...filters, attachments:[]}; results=run(filters); }
  if(results.length===0 && filters.fuelType){ relaxed.push('power-type preference'); filters={...filters, fuelType:null}; results=run(filters); }
  if(results.length===0 && filters.tireType){ relaxed.push('indoor/outdoor preference'); filters={...filters, tireType:null}; results=run(filters); }
  return {results: results.slice(0,3), relaxed};
}

function searchRentedFallback(){
  return FLEET.filter(u=>{
    if(u.status!=='Rented Out') return false;
    if(ctx.category && u.category!==ctx.category) return false;
    if(ctx.capacityMin && u.capacity_lbs < ctx.capacityMin) return false;
    return true;
  }).slice(0,2);
}

function runSearch(){
  addMsg('bot', "Checking availability now...");
  setTimeout(()=>{
    const {results, relaxed} = searchFleet();
    if(results.length){
      if(relaxed.length){
        addMsg('bot', `Nothing matched every preference, so I loosened the ${relaxed.join(' and ')} — here's what's available:`);
      } else {
        addMsg('bot', "Here's what's available that fits:");
      }
      results.forEach(u=>addCard(u, rateLabelFor(ctx.duration), u[ctx.duration]));
      clearReplies();
      askNextStep();
    } else {
      const fallback = searchRentedFallback();
      if(fallback.length){
        addMsg('bot', "Nothing's free right now, but this is close to what's currently out:");
        fallback.forEach(u=>addCard(u, rateLabelFor(ctx.duration), u[ctx.duration]));
      } else {
        addMsg('bot', "We don't have an exact match sitting available right now.");
      }
      addMsg('bot', "I'll pass your full requirements to the rental team and they'll follow up — usually within a business day.");
      clearReplies();
      askNextStep();
    }
  }, 500);
}
function rateLabelFor(field){
  return {daily_rate_usd:'Daily rate', weekly_rate_usd:'Weekly rate', monthly_rate_usd:'Monthly rate'}[field] || 'Rate';
}

// ============ Next step / close ============
function askNextStep(){
  addMsg('bot', "What would you like to do next?");
  showChips([
    {label:'Email me a quote'},
    {label:'Have someone call me'},
    {label:"That's all, thanks"}
  ], { onPick(o){
      if(o.label==='Email me a quote') emailQuote();
      else if(o.label==='Have someone call me') askCallbackTime();
      else closeChat();
    }});
  step='NEXTSTEP';
}
function emailQuote(){
  addMsg('bot', `Sending that to ${ctx.email || 'the email you gave me'} today. Anything else, ${ctx.name}?`);
  showChips([{label:'No, that\'s all'}], { onPick(){ closeChat(); } });
}
function askCallbackTime(){
  addMsg('bot', "What day or time works best for a callback?");
  step='CALLBACK_TIME';
}
function confirmCallback(text){
  addMsg('bot', `Got it — we'll call ${ctx.phone || 'you'} ${text}. Anything else, ${ctx.name}?`);
  showChips([{label:'No, that\'s all'}], { onPick(){ closeChat(); } });
}
function closeChat(){
  addMsg('bot', `Thanks for stopping by, ${ctx.name || 'friend'} — talk soon!`);
  clearReplies();
}

// ============ Reset ============
function resetChat(){
  document.getElementById('messages').innerHTML='';
  clearReplies();
  ctx = {intent:null,name:null,company:null,phone:null,email:null,timeline:null,category:null,
         capacityMin:null,tireType:null,fuelType:null,heightPref:null,attachments:[],duration:null};
  progress=0; setGauge();
  startChat();
}

// ============ Boot ============
startChat();

</script>
</body>
</html>
