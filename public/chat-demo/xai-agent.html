<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FleeetX Rental Desk — Grok (xAI) Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1F22; --ink-soft:#33383D; --steel:#4B555F; --steel-dark:#363E46;
    --paper:#F2F0EA; --border:#DCD8CC;
    --amber:#F2B705; --amber-dark:#C98F02;
    --green:#2E7D5B; --green-bg:#E4F0EA; --red:#A8432F; --red-bg:#F3E4E0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:transparent; font-family:'Inter',system-ui,sans-serif; color:var(--ink);
       overflow:hidden;}
  .widget{width:100%; max-width:420px; height:100%; margin:0 auto; background:var(--paper); border-radius:16px;
          overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.25);
          border:1px solid var(--border);}
  .header{background:var(--ink); color:#fff; padding:16px 18px 14px; display:flex; align-items:center;
          justify-content:space-between; gap:12px;}
  .header-left{display:flex; align-items:center; gap:12px;}
  .fork-mark{width:30px; height:30px; flex-shrink:0;}
  .eyebrow{font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.13em; text-transform:uppercase;
           color:var(--amber); font-weight:600; display:flex; align-items:center; gap:6px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--amber); display:inline-block; animation:pulse 2s infinite;}
  .dot.thinking{background:#fff;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .agent-name{font-family:'Oswald',sans-serif; font-size:19px; font-weight:600; margin-top:2px;}
  .reset-btn{background:none; border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.75);
             font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.04em; padding:6px 10px;
             border-radius:20px; cursor:pointer; text-transform:uppercase; transition:all .15s;}
  .reset-btn:hover{background:rgba(255,255,255,.1); color:#fff;}
  .gauge{width:20px; height:40px; position:relative; flex-shrink:0;}
  .gauge-track{width:6px; height:100%; margin:0 auto; background:rgba(255,255,255,.15); border-radius:3px; position:relative; overflow:hidden;}
  .gauge-fill{position:absolute; bottom:0; left:0; width:100%; background:var(--amber); border-radius:3px; transition:height .5s ease;}
  .gauge-labels{position:absolute; right:-15px; top:0; height:100%; display:flex; flex-direction:column;
                justify-content:space-between; font-family:'Oswald',sans-serif; font-size:8px; color:rgba(255,255,255,.4);}
  .gauge-labels span.active{color:var(--amber); font-weight:600;}
  .stripe{height:5px; flex-shrink:0; background:repeating-linear-gradient(-45deg, var(--amber) 0 8px, var(--ink) 8px 16px);}
  .messages{flex:1; overflow-y:auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:10px;}
  .msg{max-width:82%; font-size:13.5px; line-height:1.45; padding:9px 12px; border-radius:var(--radius); white-space:pre-wrap;}
  .msg.bot{align-self:flex-start; background:#fff; border:1px solid var(--border); border-bottom-left-radius:3px;}
  .msg.user{align-self:flex-end; background:var(--steel-dark); color:#fff; border-bottom-right-radius:3px;}
  .msg.error{align-self:center; background:var(--red-bg); color:var(--red); font-size:12px;}
  .typing{align-self:flex-start; background:#fff; border:1px solid var(--border); border-radius:var(--radius);
          border-bottom-left-radius:3px; padding:11px 14px; display:flex; gap:4px;}
  .typing span{width:6px; height:6px; background:var(--steel); border-radius:50%; animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
  .card{align-self:flex-start; max-width:92%; background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; font-size:12.5px;}
  .card-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .card-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px;}
  .tag{font-family:'Oswald',sans-serif; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:20px; font-weight:600;}
  .tag.avail{background:var(--green-bg); color:var(--green);} .tag.out{background:var(--red-bg); color:var(--red);}
  .spec-grid{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; margin-bottom:7px;}
  .card-rate{font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:13px; border-top:1px dashed var(--border); padding-top:6px; display:flex; justify-content:space-between;}
  .card-rate b{font-size:14.5px;}
  .replies{display:flex; flex-wrap:wrap; gap:6px; padding:2px 14px 10px;}
  .chip{font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500; background:#fff; border:1.5px solid var(--steel);
        color:var(--ink); padding:7px 13px; border-radius:20px; cursor:pointer; transition:all .12s;}
  .chip:hover{background:var(--amber); border-color:var(--amber-dark);}
  .input-row{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border); background:#fff;}
  .input-row input{flex:1; border:1.5px solid var(--border); border-radius:20px; padding:9px 14px; font-family:'Inter',sans-serif; font-size:13px; outline:none;}
  .input-row input:focus{border-color:var(--steel);} .input-row input:disabled{opacity:.5;}
  .send-btn{background:var(--amber); border:none; border-radius:50%; width:38px; height:38px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .12s;}
  .send-btn:hover{background:var(--amber-dark);} .send-btn:disabled{opacity:.4; cursor:default;}
  .send-btn svg{width:16px; height:16px;}
  .badge-live{font-family:'Oswald',sans-serif; font-size:8.5px; letter-spacing:.08em; color:rgba(255,255,255,.4); text-align:right; padding:2px 14px 6px; text-transform:uppercase;}
  .messages::-webkit-scrollbar{width:6px;} .messages::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
  .settings-bar{display:flex; gap:6px; padding:8px 14px; background:#fff; border-bottom:1px solid var(--border);}
  .settings-bar input{font-family:'IBM Plex Mono',monospace; font-size:11px; border:1.5px solid var(--border);
    border-radius:8px; padding:6px 9px; outline:none;}
  #apiKeyInput{flex:1.4; min-width:0;} #modelInput{flex:1; min-width:0;}
  .settings-bar input:focus{border-color:var(--steel);}
  .connect-btn{background:var(--ink); color:#fff; border:none; border-radius:8px; padding:6px 14px;
    font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    cursor:pointer; flex-shrink:0;}
  .connect-btn:hover{background:var(--steel-dark);}
  .connect-btn.connected{background:var(--green);}
  .settings-note{font-size:10px; color:var(--steel); padding:0 14px 8px; background:#fff; line-height:1.3;}
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <div class="header-left">
      <svg class="fork-mark" viewBox="0 0 30 30" fill="none">
        <rect x="4" y="3" width="3" height="24" fill="var(--amber)"/><rect x="10" y="3" width="3" height="24" fill="var(--amber)"/>
        <rect x="4" y="24" width="20" height="3" fill="#fff" opacity=".85"/><rect x="20" y="10" width="4" height="17" fill="#fff" opacity=".85"/>
      </svg>
      <div><div class="eyebrow"><span class="dot" id="statusDot"></span>FleeetX Rental Desk &middot; Grok</div>
        <div class="agent-name">Casey</div></div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="gauge"><div class="gauge-track"><div class="gauge-fill" id="gaugeFill" style="height:0%"></div></div>
        <div class="gauge-labels"><span id="labelB">B</span><span id="labelA">A</span></div></div>
      <button class="reset-btn" onclick="resetChat()">Reset</button>
    </div>
  </div>
  <div class="stripe"></div>
  <div class="settings-bar" id="settingsBar">
    <input type="password" id="apiKeyInput" placeholder="xAI API key (sk-... or xai-...)">
    <input type="text" id="modelInput" value="grok-4-fast" placeholder="model name">
    <button class="connect-btn" onclick="connect()">Connect</button>
  </div>
  <div class="settings-note" id="settingsNote">Key stays in this tab's memory only — never saved, never sent anywhere but api.x.ai. If the model name errors, check console.x.ai → Models for the exact current string.</div>
  <div class="messages" id="messages"></div>
  <div class="replies" id="replies"></div>
  <div class="input-row">
    <input type="text" id="textInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')submitText()">
    <button class="send-btn" id="sendBtn" onclick="submitText()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11L21 3L13 21L11 13L3 11Z" fill="#1C1F22"/></svg>
    </button>
  </div>
  <div class="badge-live" id="badgeLive">Enter your xAI API key above, then hit Connect</div>
</div>

const SYSTEM_PROMPT = `You are Casey, the chat assistant for FleeetX, a forklift and material handling equipment rental company, embedded as a website chat widget.

Your job, in strict order:
1. Figure out why the visitor is chatting. Priority: identify whether they want to RENT equipment.
   - Rental language ("I need to rent...", "do you have a forklift available") -> continue to step 2.
   - Parts/service/repair/warranty language -> do NOT do equipment qualification. Collect name, phone, and a one-line description of the issue, confirm it's logged, and stop there.
   - Existing-order language about a return/due/end date ("when's my rental due back", "when do I need to return it") -> go straight to the ORDER LOOKUP flow below instead of anything else.
   - Genuinely unclear -> ask once which of the above it is. Don't guess silently.
2. Collect, one field at a time: full name, company name, phone number, email, and their timeline (this week / next 2 weeks / just researching). If the visitor volunteers multiple fields in one message, extract all of them and only ask what's still missing. Do not move to step 3 until you have all of this.
3. Qualify what they need to rent by asking, one question at a time, only what you don't already know:
   - category: "Forklift", "Scissor Lift", or "Piggyback Forklift (Truck-Mounted)"
   - capacity needed in lbs
   - environment: indoor/smooth floor (Cushion tire) vs outdoor/rough ground (Pneumatic tire)
   - fuel preference: Electric, LPG (propane), Diesel, or no preference
   - height needed in inches (assume ~189" standard pallet racking if they don't know and don't press on this)
   - any must-have attachments: Side Shift, Fork Positioner, Clamp, A/C Cab, Rotator (fine to have none)
   - rental duration: day / week / month / ongoing
4. Call search_equipment once you have at least category and capacity_lbs_min. Only ever present units, specs, and rates that came back from the tool. Never invent a unit, spec, or rate.
5. Present up to 3 results conversationally: make, model, capacity, tire, fuel, attachments, and the rate matching their stated duration. If nothing matches, say so, try the tool again with one fewer preference, and if still nothing, offer to flag it for the rental team.
6. Ask what's next: email a quote, book a callback, or nothing else. Close warmly using their name.

INTERPRETING WHAT CUSTOMERS SAY (apply throughout, not just once):
- Capacity: "5k"/"5,000 lbs" -> 5000. Tons -> lbs x2000. A range -> use the upper bound. "pallets" with no number -> assume 5000 but say so and confirm ("standard pallets run about 5,000 lbs — sound right?"). Vague ("heavy," "big load") with no number -> ask for one, don't guess high.
- Environment: warehouse/inside/smooth/concrete -> Cushion. yard/gravel/construction/outside/uneven/dirt -> Pneumatic. "both" -> leave unset.
- Fuel: "electric"/"battery" -> Electric. "propane"/"LP" -> LPG. "diesel" -> Diesel. Bare "gas" is ambiguous in this industry (often means propane, sometimes gasoline which isn't in this fleet) -> ask "propane, or does it not matter?" rather than assuming.
- Height: explicit ft/in -> convert feet x12. "standard racking"/"don't know" -> default ~189", don't ask further. "really tall"/"high bay" with no number -> ask for one.
- Attachments: "side to side" -> Side Shift. "tilt/angle forks" -> Fork Positioner. "grab/squeeze, no pallet" -> Clamp. "A/C, cab, hot/cold out there" -> A/C Cab. "rotate/dump/spin load" -> Rotator. "nothing special" -> none, move on.
- Duration: "today/tomorrow only" -> day. "a few days" is ambiguous -> ask "under a week, or more like a week-plus?". "a week/few weeks" -> week. "a month/ongoing/long-term/not sure" -> month.
- If a customer corrects an earlier answer mid-flow, update that field in place and don't re-ask prior questions or restart. Only re-run search_equipment if a search already ran.
- Reflect back anything involving an assumption or unit conversion (e.g. "2 tons -> about 4,000 lbs, right?"), but don't narrate obvious direct matches.

ESCALATION (bypasses everything above):
- "broken down"/"down right now"/"emergency"/repeated frustration/profanity -> acknowledge once, collect name + phone, say you're escalating to a live person immediately. Do not run equipment qualification.
- Explicit request for a human -> confirm you're an AI assistant and offer immediate handoff rather than deflecting.

ORDER LOOKUP FLOW (existing-order date questions only — not billing, not complaints, not repairs, those still go to a human):
- Ask for the unit number or serial number (either is fine, don't require both).
- Call lookup_order with whatever they give you, even a partial number.
- If the tool finds no match: say so, ask them to double-check the number, offer to flag it for the rental team.
- If it finds more than one match: ask for the other identifier to narrow it down.
- If found and status is "Rented Out": give the return_date directly as the expected end date — that's all they asked for. Optionally mention start_date for context.
- If found and status is "Available": say it's not currently showing as checked out (may already be returned) and offer to route to the rental team for full history.
- NEVER mention or reveal current_location in this flow, even if it's present in the tool result — it's someone else's job-site address, not relevant to answering a return-date question.
- This flow only answers return/end dates. Extending a rental, billing, or anything else still routes to a human.

Hard rules:
- Never quote exact pricing except numbers that came directly from a search_equipment tool result.
- Never promise delivery dates outside of the confirmed lookup flow above.
- Keep every message short: 1-3 sentences, one question at a time.
- If the visitor's very first message is "[SESSION_START]", treat that as the chat just opening — don't acknowledge it, just open with your step-1 greeting.

Required formatting on every single response, no exceptions:
- The FIRST line must be exactly: <meta phase="A" progress="NN"/>  or  <meta phase="B" progress="NN"/>
  Use phase="A" while still on steps 1-2 above or mid order-lookup, phase="B" once you're qualifying equipment, searching, presenting results, or closing. NN is your rough 0-100 estimate of how far through the whole conversation you are. This line is stripped before the visitor ever sees it — never explain it or refer to it.
- If the very next thing you're asking has a small fixed set of sensible answers (max 4 options), end your message with one more line: <suggest>Option One|Option Two|Option Three</suggest> using short visitor-facing labels. Omit this line entirely when free text is expected (names, phone, email, company, exact numbers, open questions, unit/serial numbers).`;

const TOOLS = [{
  type: "function",
  function: {
    name: "search_equipment",
    description: "Search the active rental fleet for available units matching customer requirements.",
    parameters: {
      type: "object",
      properties: {
        category: {type:"string", enum:["Forklift","Scissor Lift","Piggyback Forklift (Truck-Mounted)"]},
        capacity_lbs_min: {type:"number"},
        tire_type: {type:"string", enum:["Cushion","Pneumatic"]},
        fuel_type: {type:"string", enum:["LPG","Electric","Diesel"]},
        attachments: {type:"array", items:{type:"string", enum:["Side Shift","Fork Positioner","Clamp","A/C Cab","Rotator"]}}
      },
      required: []
    }
  }
},{
  type: "function",
  function: {
    name: "lookup_order",
    description: "Look up a unit by unit number or serial number (full or partial) to answer existing-order return-date questions.",
    parameters: {
      type: "object",
      properties: {
        identifier: {type:"string", description:"Unit number (e.g. 'AR 1102') or serial number, full or partial, as given by the customer."}
      },
      required: ["identifier"]
    }
  }
}];

function executeSearchEquipment(input){
  let results = FLEET.filter(u=>{
    if(u.status!=='Available') return false;
    if(input.category && u.category!==input.category) return false;
    if(input.capacity_lbs_min && u.capacity_lbs < input.capacity_lbs_min) return false;
    if(input.tire_type && u.tire_type!==input.tire_type) return false;
    if(input.fuel_type && u.fuel_type!==input.fuel_type) return false;
    if(input.attachments && input.attachments.length){
      const has=(u.attachments||'').split(',').map(s=>s.trim());
      if(!input.attachments.every(a=>has.includes(a))) return false;
    }
    return true;
  }).sort((a,b)=>a.capacity_lbs-b.capacity_lbs).slice(0,5)
    .map(u=>({unit_number:u.unit_number, make:u.make, model:u.model, category:u.category,
               capacity_lbs:u.capacity_lbs, tire_type:u.tire_type, fuel_type:u.fuel_type,
               extended_height_in:u.extended_height_in, attachments:u.attachments,
               daily_rate_usd:u.daily_rate_usd, weekly_rate_usd:u.weekly_rate_usd,
               monthly_rate_usd:u.monthly_rate_usd, status:u.status}));
  return {count: results.length, results};
}

function executeLookupOrder(input){
  const norm = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const q = norm(input.identifier);
  if(!q) return {found:false, count:0, matches:[]};
  const matches = FLEET.filter(u => norm(u.unit_number).includes(q) || norm(u.serial_number).includes(q))
    .map(u=>({unit_number:u.unit_number, make:u.make, model:u.model, status:u.status,
               start_date:u.start_date, return_date:u.return_date})); // deliberately no current_location
  return {found:matches.length>0, count:matches.length, matches};
}

function executeTool(name, input){
  if(name === 'search_equipment') return executeSearchEquipment(input);
  if(name === 'lookup_order') return executeLookupOrder(input);
  return {error: 'unknown tool'};
}

let messages = [];
let busy = false;
let apiKey = null;
let modelName = null;
let connected = false;

function connect(){
  const key = document.getElementById('apiKeyInput').value.trim();
  const model = document.getElementById('modelInput').value.trim();
  if(!key){ addMsg('error', 'Enter an xAI API key first.'); return; }
  apiKey = key; modelName = model || 'grok-4-fast';
  connected = true;
  document.querySelector('.connect-btn').classList.add('connected');
  document.querySelector('.connect-btn').textContent = 'Connected';
  document.getElementById('badgeLive').textContent = 'Powered by ' + modelName + ' (xAI) · real tool calls against real fleet data';
  document.getElementById('messages').innerHTML='';
  clearReplies();
  messages = [{role:'system', content: SYSTEM_PROMPT}, {role:'user', content:'[SESSION_START]'}];
  updateGauge('A', 0);
  runTurn();
}

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function scrollDown(){ const m=document.getElementById('messages'); requestAnimationFrame(()=>requestAnimationFrame(()=>{ m.scrollTop=m.scrollHeight; })); }
// Safety net: pin to bottom on any change to the message list (card renders, font-swap
// reflow, etc.), not just the call sites that already invoke scrollDown() directly.
new MutationObserver(scrollDown).observe(document.getElementById('messages'), {childList:true, subtree:true, characterData:true});
function clearReplies(){ document.getElementById('replies').innerHTML=''; }

function addMsg(who, text){
  document.getElementById('messages').appendChild(el('div','msg '+who, escapeHtml(text).replace(/\n/g,'<br>')));
  scrollDown();
}
function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }

function addCard(u, rateField){
  const rateLabel = {daily_rate_usd:'Daily rate', weekly_rate_usd:'Weekly rate', monthly_rate_usd:'Monthly rate'}[rateField] || 'Monthly rate';
  const rateVal = u[rateField] || u.monthly_rate_usd;
  const c = el('div','card');
  c.innerHTML = `<div class="card-top"><span class="card-title">${u.make} ${u.model}</span><span class="tag avail">Available</span></div>
    <div class="spec-grid"><span>CAP &nbsp;${u.capacity_lbs.toLocaleString()} lb</span><span>TIRE &nbsp;${u.tire_type}</span>
    <span>FUEL &nbsp;${u.fuel_type}</span><span>HGT &nbsp;${u.extended_height_in}"</span></div>
    ${u.attachments ? `<div style="font-size:11px;color:var(--steel);margin-bottom:6px;">+ ${u.attachments}</div>`:''}
    <div class="card-rate"><span>${rateLabel}</span><b>$${rateVal.toLocaleString()}</b></div>`;
  document.getElementById('messages').appendChild(c);
  scrollDown();
}

function showTyping(){
  const t = el('div','typing'); t.id='typingIndicator';
  t.innerHTML='<span></span><span></span><span></span>';
  document.getElementById('messages').appendChild(t); scrollDown();
  document.getElementById('statusDot').classList.add('thinking');
}
function hideTyping(){
  const t = document.getElementById('typingIndicator'); if(t) t.remove();
  document.getElementById('statusDot').classList.remove('thinking');
}

function updateGauge(phase, progress){
  document.getElementById('gaugeFill').style.height = Math.max(0,Math.min(100,progress)) + '%';
  document.getElementById('labelA').classList.toggle('active', phase==='A');
  document.getElementById('labelB').classList.toggle('active', phase==='B');
}

function showChips(labels){
  clearReplies();
  const box = document.getElementById('replies');
  labels.forEach(label=>{
    const chip = el('div','chip', escapeHtml(label));
    chip.onclick = ()=>{ clearReplies(); sendUserTurn(label); };
    box.appendChild(chip);
  });
}

async function callGrok(){
  const response = await fetch("https://api.x.ai/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json", "Authorization":"Bearer " + apiKey},
    body: JSON.stringify({
      model: modelName,
      messages: messages,
      tools: TOOLS,
      tool_choice: "auto",
      max_tokens: 1000
    })
  });
  if(!response.ok){
    const errBody = await response.text().catch(()=> "");
    throw new Error("API error " + response.status + (errBody ? " — " + errBody.slice(0,200) : ""));
  }
  return await response.json();
}

function parseControlTags(text){
  let phase='B', progress=50, suggestions=[];
  let body = text;
  const metaMatch = body.match(/^<meta phase="([AB])" progress="(\d+)"\/>\s*/);
  if(metaMatch){ phase=metaMatch[1]; progress=parseInt(metaMatch[2],10); body=body.slice(metaMatch[0].length); }
  const suggestMatch = body.match(/\n?<suggest>(.*?)<\/suggest>\s*$/s);
  if(suggestMatch){ suggestions = suggestMatch[1].split('|').map(s=>s.trim()).filter(Boolean); body=body.slice(0, suggestMatch.index); }
  return {phase, progress, suggestions, body: body.trim()};
}

async function runTurn(){
  if(!connected){ addMsg('error', 'Enter your xAI API key and hit Connect first.'); return; }
  busy = true;
  setInputEnabled(false);
  showTyping();
  try{
    let data = await callGrok();
    let message = data.choices[0].message;
    // Tool-use loop
    while(message.tool_calls && message.tool_calls.length){
      messages.push({role:'assistant', content: message.content || null, tool_calls: message.tool_calls});
      for(const call of message.tool_calls){
        let args = {};
        try{ args = JSON.parse(call.function.arguments || "{}"); }catch(e){ args = {}; }
        const result = executeTool(call.function.name, args);
        if(call.function.name === 'search_equipment'){
          window.__lastSearchResults = result.results;
        }
        messages.push({role:'tool', tool_call_id: call.id, content: JSON.stringify(result)});
      }
      data = await callGrok();
      message = data.choices[0].message;
    }
    hideTyping();
    const raw = message.content || "";
    const {phase, progress, suggestions, body} = parseControlTags(raw);
    updateGauge(phase, progress);
    if(body) addMsg('bot', body);
    if(window.__lastSearchResults && window.__lastSearchResults.length){
      const durField = guessDurationField(body);
      window.__lastSearchResults.forEach(u=>addCard(u, durField));
      window.__lastSearchResults = null;
    }
    messages.push({role:'assistant', content: raw});
    if(suggestions.length) showChips(suggestions); else clearReplies();
  } catch(err){
    hideTyping();
    addMsg('error', "Trouble reaching Grok right now (" + err.message + "). Check your API key and model name, then try again.");
  }
  busy = false;
  setInputEnabled(true);
}

function guessDurationField(text){
  const t = text.toLowerCase();
  if(/day/.test(t) && !/month|week/.test(t)) return 'daily_rate_usd';
  if(/week/.test(t) && !/month/.test(t)) return 'weekly_rate_usd';
  return 'monthly_rate_usd';
}

function setInputEnabled(on){
  document.getElementById('textInput').disabled = !on;
  document.getElementById('sendBtn').disabled = !on;
}

function submitText(){
  if(busy) return;
  const input = document.getElementById('textInput');
  const val = input.value.trim();
  if(!val) return;
  input.value='';
  sendUserTurn(val);
}

function sendUserTurn(text){
  if(busy) return;
  addMsg('user', text);
  clearReplies();
  messages.push({role:'user', content:text});
  runTurn();
}

function resetChat(){
  document.getElementById('messages').innerHTML='';
  clearReplies();
  if(!connected){ return; }
  messages = [{role:'system', content: SYSTEM_PROMPT}, {role:'user', content:'[SESSION_START]'}];
  updateGauge('A',0);
  runTurn();
}

</script>
